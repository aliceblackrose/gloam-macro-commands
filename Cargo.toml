[workspace]
members = [
    "crates/gloam-commands",
    "crates/gloam-commands-macros",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/aliceblackrose/gloam-macro-commands"

[workspace.dependencies]
gloamwire = { git = "https://github.com/aliceblackrose/gloamwire", rev = "ae8f98d9f99f9082b152358a838193f717b76c87" }
gloam-commands-macros = { path = "crates/gloam-commands-macros", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
