[workspace]
members = [
    "crates/gloam-commands",
    "crates/gloam-commands-macros",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/aliceblackrose/gloam-macro-commands"

[workspace.dependencies]
gloamwire = { git = "https://github.com/aliceblackrose/gloamwire", rev = "5b5fa2c5877157422616ac96df14d176190ace83" }
gloam-commands-macros = { path = "crates/gloam-commands-macros", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
