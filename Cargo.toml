[workspace]
members = [
    "crates/gloam-commands",
    "crates/gloam-commands-macros",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/aliceblackrose/gloam-macro-commands"

[workspace.dependencies]
gloamwire = { git = "https://github.com/aliceblackrose/gloamwire", rev = "86633878229c4cbfaedfe2c5c524186f7bd683f9" }
gloam-commands-macros = { path = "crates/gloam-commands-macros", version = "0.1.1" }
regex = "1"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
